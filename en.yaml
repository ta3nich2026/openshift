apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: camoufox-one-shot

parameters:
  - name: NAME
    value: camoufox-vm
  - name: PASSWORD
    value: ubuntu123

objects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${NAME}-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 40Gi

  - apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      name: ${NAME}
    spec:
      runStrategy: Always
      template:
        spec:
          domain:
            cpu:
              cores: 2
            memory:
              guest: 4Gi
            devices:
              disks:
                - name: rootdisk
                  disk:
                    bus: virtio
                - name: datadisk
                  disk:
                    bus: virtio
                - name: cloudinitdisk
                  disk:
                    bus: virtio
              interfaces:
                - name: default
                  masquerade: {}
              rng: {}
          networks:
            - name: default
              pod: {}
          volumes:
            - name: rootdisk
              containerDisk:
                image: quay.io/containerdisks/ubuntu:22.04

            - name: datadisk
              persistentVolumeClaim:
                claimName: ${NAME}-data

            - name: cloudinitdisk
              cloudInitNoCloud:
                userDataSecretRef:
                  name: camoufox-cloudinit
                  #cloud-config
                  user: ubuntu
                  password: ${PASSWORD}
                  chpasswd: { expire: False }
                  ssh_pwauth: true

                  runcmd:
                    - |
                      exec > /var/log/startup.log 2>&1

                      echo "[*] Starting setup..."

                      # Wait for network
                      for i in {1..10}; do
                        ping -c1 8.8.8.8 && break
                        sleep 3
                      done

                      # Mount disk
                      DISK="/dev/vdb"
                      if [ -b "$DISK" ]; then
                        mkdir -p /mnt/pvc
                        mount $DISK /mnt/pvc || (mkfs.ext4 $DISK && mount $DISK /mnt/pvc)
                        echo "$DISK /mnt/pvc ext4 defaults 0 2" >> /etc/fstab
                      fi

                      # Redirect APT
                      mkdir -p /mnt/pvc/apt_cache /mnt/pvc/apt_lists || true
                      rm -rf /var/cache/apt /var/lib/apt/lists
                      ln -s /mnt/pvc/apt_cache /var/cache/apt
                      ln -s /mnt/pvc/apt_lists /var/lib/apt/lists

                      # Fix apt
                      apt-get clean
                      rm -rf /var/lib/apt/lists/*
                      for i in {1..5}; do
                        apt-get update && break
                        sleep 5
                      done

                      # Install
                      for i in {1..5}; do
                        apt-get install -y docker.io nordvpn && break
                        sleep 5
                      done

                      # Docker setup
                      systemctl stop docker containerd || true
                      mkdir -p /mnt/pvc/docker_data /mnt/pvc/containerd_data || true
                      rm -rf /var/lib/docker /var/lib/containerd
                      ln -s /mnt/pvc/docker_data /var/lib/docker
                      ln -s /mnt/pvc/containerd_data /var/lib/containerd

                      printf '{\n  "data-root": "/var/lib/docker",\n  "storage-driver": "overlay2"\n}\n' > /etc/docker/daemon.json

                      systemctl daemon-reexec
                      systemctl enable --now containerd docker
                      usermod -aG docker ubuntu

                      # NordVPN
                      systemctl enable --now nordvpnd || true
                      nordvpn set technology openvpn || true
                      nordvpn set protocol tcp || true
                      nordvpn set ipv6 off || true
                      nordvpn whitelist add port 22 || true

                      echo "[*] DONE"
